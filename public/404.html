<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      (function() {
        var l = window.location;
        var base = '/negahesabz';
        var path = l.pathname.indexOf(base) === 0 ? l.pathname.slice(base.length) : l.pathname;
        if (!path || path === '/') path = '/fa/';
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + base + '/?p=' + encodeURIComponent(path + l.search + l.hash));
      })();
    </script>
  </head>
  <body></body>
</html>
