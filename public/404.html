<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <title>Negah Sabz</title>
    <script>
      (function (l) {
        var base = '/negahesabz';
        var path = l.pathname.indexOf(base) === 0 ? l.pathname.slice(base.length) : l.pathname;
        var query = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
        l.replace(l.protocol + '//' + l.host + base + '/?p=' + path + query + l.hash);
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
